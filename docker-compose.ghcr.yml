# Override produksi: tarik image GHCR yang di-pin, jangan build di host.
#
# Dipakai bersama compose dasar + overlay Cloudflare (DEPLOY §7.4):
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.ghcr.yml \
#                  -f docker-compose.cloudflare.yml pull
#   docker compose ... up -d --no-build
#
# Compose dasar hanya punya blok `build:`; berkas ini MENAMBAHKAN `image:` pada
# service yang sama. Dengan `--no-build`, Compose memakai image hasil `pull` dan
# tidak pernah menjalankan build (vite/tsc bisa OOM di host 1 vCPU/2 GB — §7.9).
#
# Pin ke tag imutabel `:sha-<commit>`, bukan `:edge` yang bergerak. Ganti tag di
# dua baris `image:` saat naik versi; lihat §7.10 untuk update/rollback.
services:
  api:
    image: ghcr.io/luniramilis-rgb/jurnal-zitn-api:sha-dd96d263ce353728ffe75e7decc884993dc18eb5
    volumes:
      # PRIVATE, PER-MARKET risk-profile grids (ZITN-TECH-043/047); see DEPLOY §7.12.
      # `risk_profile.json` is the legacy US file, kept as the RISK_PROFILE_PATH fallback.
      - ./data/risk_profile.json:/app/risk_profile.json:ro
      - ./data/risk_profile_us.json:/app/risk_profile_us.json:ro
      - ./data/risk_profile_id.json:/app/risk_profile_id.json:ro
  web:
    image: ghcr.io/luniramilis-rgb/jurnal-zitn-web:sha-dd96d263ce353728ffe75e7decc884993dc18eb5
