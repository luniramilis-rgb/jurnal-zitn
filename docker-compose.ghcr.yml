# Override produksi: tarik image GHCR yang di-pin, jangan build di host.
#
# Dipakai bersama compose dasar + overlay Cloudflare (DEPLOY §7.4):
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.ghcr.yml \
#                  -f docker-compose.cloudflare.yml pull
#   docker compose ... up -d --no-build
#
# Compose dasar hanya punya blok `build:`; berkas ini MENAMBAHKAN `image:` pada
# service yang sama. Dengan `--no-build`, Compose memakai image hasil `pull` dan
# tidak pernah menjalankan build (vite/tsc bisa OOM di host 1 vCPU/2 GB — §7.9).
#
# Pin ke tag imutabel `:sha-<commit>`, bukan `:edge` yang bergerak. Ganti tag di
# dua baris `image:` saat naik versi; lihat §7.10 untuk update/rollback.
services:
  api:
    image: ghcr.io/luniramilis-rgb/jurnal-zitn-api:sha-1b2fecf275f9b29bd4d86bf08b347da018890fcc
  web:
    image: ghcr.io/luniramilis-rgb/jurnal-zitn-web:sha-1b2fecf275f9b29bd4d86bf08b347da018890fcc
