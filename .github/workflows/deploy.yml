name: Deploy (jurnal)

# Build + publish the journal images after CI succeeds on `main`. The VPS then
# pulls them itself via Watchtower (`docker-compose.auto.yml`) — no inbound SSH is
# needed, which fits the host's restricted firewall.
#
# INERT BY DEFAULT. The job guard `vars.AUTO_DEPLOY_ENABLED == 'true'` means
# nothing builds until the owner opts in:
#   Settings → Secrets and variables → Actions → Variables:
#     AUTO_DEPLOY_ENABLED = true
#
# Flow: push to main → CI (checks/test-api/test-web) → on success → build+push
# `:edge` (moving) and `:sha-<commit>` (immutable) → Watchtower on the VPS pulls
# `:edge` on its schedule and recreates `api`/`web`.
#
# Rollback: pin `:sha-<commit>` (known good) in docker-compose.ghcr.yml and
# `pull && up -d --no-build`, or disable Watchtower temporarily.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: >-
      vars.AUTO_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: jurnal-zitn-api
            dockerfile: docker/Dockerfile.api
          - image: jurnal-zitn-web
            dockerfile: docker/Dockerfile.web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR rejects uppercase namespaces; the owner may contain capitals.
      - name: Resolve GHCR namespace (lowercased owner)
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}:edge
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
